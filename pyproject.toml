[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lethe"
version = "1.0.0"
description = "Verifiable per-view erasure for graph vector indexes"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "hnswlib>=0.7.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pandas>=2.0", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]
